<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub AI Sync – Offline (No Build)</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1020;
        --card: #151d34;
        --muted: #95a0c2;
        --text: #f2f5ff;
        --accent: #6ea8fe;
        --danger: #ff6b6b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, system-ui, Arial, sans-serif;
        background: radial-gradient(circle at top, #16203f, var(--bg));
        color: var(--text);
      }
      .wrap { max-width: 980px; margin: 0 auto; padding: 24px; }
      .card {
        background: linear-gradient(180deg, #1a2445, var(--card));
        border: 1px solid #2a3560;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 16px;
      }
      h1, h2, h3 { margin-top: 0; }
      .muted { color: var(--muted); }
      .grid { display: grid; gap: 12px; }
      .g2 { grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); }
      input, textarea, select, button {
        width: 100%;
        border-radius: 8px;
        border: 1px solid #314173;
        background: #111935;
        color: var(--text);
        padding: 10px;
      }
      button {
        cursor: pointer;
        background: linear-gradient(180deg, #2e4f9f, #244184);
        border-color: #4566bb;
      }
      button.secondary { background: #1a254b; }
      button.danger { background: #5e2020; border-color: #8b3232; }
      ul { list-style: none; padding-left: 0; margin: 0; }
      li { padding: 10px; border: 1px solid #2a3560; border-radius: 8px; margin-bottom: 8px; }
      .row { display: flex; gap: 8px; align-items: center; }
      .row > * { flex: 1; }
      .small { font-size: 12px; }
      .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: #22315f; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- React + Babel im Browser: keine Build-Pipeline nötig -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
      const STORAGE_KEY = "github-ai-sync-offline-v1";

      const initialState = {
        settings: { githubToken: "", geminiToken: "" },
        projects: [],
        history: []
      };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : initialState;
        } catch {
          return initialState;
        }
      }

      function saveState(state) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      }

      function App() {
        const [state, setState] = React.useState(loadState());
        const [form, setForm] = React.useState({ name: "", repo: "", branch: "main" });
        const [note, setNote] = React.useState("");

        React.useEffect(() => saveState(state), [state]);

        const addProject = (e) => {
          e.preventDefault();
          if (!form.name || !form.repo) return;
          const project = { id: crypto.randomUUID(), ...form, createdAt: Date.now() };
          setState((prev) => ({ ...prev, projects: [project, ...prev.projects] }));
          setForm({ name: "", repo: "", branch: "main" });
        };

        const removeProject = (id) => {
          setState((prev) => ({ ...prev, projects: prev.projects.filter((p) => p.id !== id) }));
        };

        const saveSettings = (e) => {
          e.preventDefault();
          const data = new FormData(e.target);
          setState((prev) => ({
            ...prev,
            settings: {
              githubToken: data.get("githubToken") || "",
              geminiToken: data.get("geminiToken") || ""
            }
          }));
        };

        const addHistory = () => {
          if (!note.trim()) return;
          setState((prev) => ({
            ...prev,
            history: [{ id: crypto.randomUUID(), text: note.trim(), timestamp: Date.now() }, ...prev.history]
          }));
          setNote("");
        };

        const clearAll = () => {
          if (!confirm("Alle lokal gespeicherten Daten wirklich löschen?")) return;
          setState(initialState);
        };

        return (
          <div className="wrap">
            <div className="card">
              <h1>GitHub AI Sync (Offline, statisch)</h1>
              <p className="muted">
                Läuft als <strong>eine statische Datei</strong> (z. B. GitHub Pages), ohne Build-Schritt und ohne Firebase.
                Alle Daten werden lokal im Browser gespeichert (localStorage).
              </p>
              <span className="tag">No Build • Babel im Browser • Offline-Speicherung</span>
            </div>

            <div className="card">
              <h2>Globale Einstellungen (lokal)</h2>
              <form onSubmit={saveSettings} className="grid g2">
                <input name="githubToken" placeholder="GitHub Token" defaultValue={state.settings.githubToken} />
                <input name="geminiToken" placeholder="Gemini Token" defaultValue={state.settings.geminiToken} />
                <button type="submit">Einstellungen speichern</button>
                <button type="button" className="secondary" onClick={clearAll}>Alles lokal zurücksetzen</button>
              </form>
            </div>

            <div className="card">
              <h2>Projekt anlegen</h2>
              <form onSubmit={addProject} className="grid g2">
                <input placeholder="Projektname" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
                <input placeholder="owner/repo" value={form.repo} onChange={(e) => setForm({ ...form, repo: e.target.value })} />
                <input placeholder="Branch" value={form.branch} onChange={(e) => setForm({ ...form, branch: e.target.value })} />
                <button type="submit">Projekt speichern</button>
              </form>

              <ul style={{ marginTop: 12 }}>
                {state.projects.map((p) => (
                  <li key={p.id}>
                    <div className="row">
                      <div>
                        <strong>{p.name}</strong>
                        <div className="small muted">{p.repo} • {p.branch}</div>
                      </div>
                      <button className="danger" onClick={() => removeProject(p.id)}>Löschen</button>
                    </div>
                  </li>
                ))}
                {state.projects.length === 0 && <li className="muted">Noch keine Projekte gespeichert.</li>}
              </ul>
            </div>

            <div className="card">
              <h2>Offline-Verlauf</h2>
              <div className="row">
                <textarea rows="2" placeholder="Kurze Notiz / Commit-Idee" value={note} onChange={(e) => setNote(e.target.value)} />
                <button onClick={addHistory}>Hinzufügen</button>
              </div>
              <ul style={{ marginTop: 12 }}>
                {state.history.map((h) => (
                  <li key={h.id}>
                    <div>{h.text}</div>
                    <div className="small muted">{new Date(h.timestamp).toLocaleString("de-DE")}</div>
                  </li>
                ))}
                {state.history.length === 0 && <li className="muted">Noch kein Verlauf vorhanden.</li>}
              </ul>
            </div>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
